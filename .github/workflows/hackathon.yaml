name: build-and-test-deploy

on:
  push:
    branches:
      - hackathon

jobs:
  build-source-dist:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build

    - name: Build package
      shell: bash
      run: |
        mkdir -p glmpy/bin
        python -m build --sdist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-dist
        path: dist/

  build-wheels-manylinux-aarch64:
    name: Build wheels on manylinux for aarch64
    runs-on: ubuntu-22.04
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile GLM for aarch64
        run: |
          docker run --platform linux/arm64/v8 --rm -v $(pwd)/glm:/glm quay.io/pypa/manylinux_2_28_aarch64  /bin/bash -c "\
            git clone https://github.com/AquaticEcoDynamics/AED_Tools && \
            yum update -y && \
            yum install epel-release -y && \
            yum install -y netcdf-devel gd gd-devel gcc-gfortran && \
            cd AED_Tools/ && \
            ./fetch_sources.sh all && \
            cd GLM && \
            git switch ch4-sync && \
            cd .. && \
            cd libaed-water && \
            git switch ch4-sync && \
            cd .. && \
            cd libaed-api && \
            git switch ch4-sync && \
            cd .. && \
            mkdir -p binaries/glm_latest && \
            ./build_glm.sh && \
            cp binaries/glm_latest/glm /glm/ && \
            ldd /glm/glm | grep -oE '/[^ ]+\.so[^ ]*' | sort -u | xargs -I '{}' cp -vL '{}' /glm/"
          mkdir -p glmpy/bin
          sudo mv glm/glm glmpy/bin/
          sudo chmod +x glmpy/bin/*
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/glm
      
      - name: Build wheels for aarch64
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* pp39-* pp310-*'
          CIBW_ARCHS_LINUX: 'aarch64'
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/glm"
      
      - name: Upload aarch64 wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-2-28-aarch64
          path: ./wheelhouse/*.whl

  build-wheels-manylinux-x86_64:
    name: Build wheels on manylinux for x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compile GLM for x86_64
        run: |
          docker run --rm -v $(pwd)/glm:/glm quay.io/pypa/manylinux_2_28_x86_64 /bin/bash -c "\
            git clone https://github.com/AquaticEcoDynamics/AED_Tools && \
            yum update -y && \
            yum install epel-release -y && \
            yum install -y netcdf-devel gd gd-devel gcc-gfortran && \
            cd AED_Tools/ && \
            ./fetch_sources.sh all && \
            cd GLM && \
            git switch ch4-sync && \
            cd .. && \
            cd libaed-water && \
            git switch ch4-sync && \
            cd .. && \
            cd libaed-api && \
            git switch ch4-sync && \
            cd .. && \
            mkdir -p binaries/glm_latest && \
            ./build_glm.sh && \
            cp binaries/glm_latest/glm /glm/ && \
            ldd /glm/glm | grep -oE '/[^ ]+\.so[^ ]*' | sort -u | xargs -I '{}' cp -vL '{}' /glm/"
          mkdir -p glmpy/bin
          sudo mv glm/glm glmpy/bin/
          sudo chmod +x glmpy/bin/*
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/glm

      - name: Build wheels for x86_64
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* pp39-* pp310-*'
          CIBW_ARCHS_LINUX: 'x86_64'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: "LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/glm"

      - name: Upload x86_64 wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-2-28-x86_64
          path: ./wheelhouse/*.whl

  build-wheels-macos-arm64:
    name: Build wheels on MacOS for ARM64
    runs-on: macos-14

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install packages and setup
        run: |
          brew reinstall gcc
          brew install netcdf
          brew install gd
          git clone https://github.com/AquaticEcoDynamics/AED_Tools "$GITHUB_WORKSPACE/AED_Tools"

      - name: Compile GLM for ARM64
        env:
          CPATH: /opt/homebrew/include:$CPATH
          LIBRARY_PATH: /opt/homebrew/lib:$LIBRARY_PATH
        run: |
          cd $GITHUB_WORKSPACE/AED_Tools
          ./fetch_sources.sh all
          cd GLM && git switch ch4-sync && cd ..
          cd libaed-water && git switch ch4-sync && cd ..
          cd libaed-api && git switch ch4-sync && cd ..
          ./build_glm.sh
          cd $GITHUB_WORKSPACE
          mkdir -p $GITHUB_WORKSPACE/glmpy/bin/
          GLM_BIN=$(find $GITHUB_WORKSPACE/AED_Tools/binaries -type f -name glm -path '*glm_latest*' | head -n1)
          echo "Found GLM binary at: $GLM_BIN"
          cp "$GLM_BIN" $GITHUB_WORKSPACE/glmpy/bin/

      - name: Build wheels for ARM64
        uses: pypa/cibuildwheel@v2.17.0
        env:
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* pp39-* pp310-*'
          CIBW_ARCHS_MACOS: 'arm64'

      - name: Upload ARM64 wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: ./wheelhouse/*.whl
 